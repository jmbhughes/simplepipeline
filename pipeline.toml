[worker]
database = "pipeline.sqlite3"
poll_interval_seconds = 30
claim_timeout_seconds = 86400

[functions.l2]
output = "L2"
processor = "demo:make_l2"
output_version = "0.0.0"

[[functions.l2.rules]]
type = "same_timestamp"
inputs = ["L1"]

[[functions.l2.rules]]
type = "evenly_distributed_window"
inputs = ["L1B"]
window_seconds = 604800
count = 100

[functions.l2.cadence]
type = "on_input"
product = "L1"
