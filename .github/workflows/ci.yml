name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: uv sync --locked --extra test --python ${{ matrix.python-version }}

      - name: Run tests with branch coverage
        run: uv run --python ${{ matrix.python-version }} --with coverage coverage run --branch --source=simplepipeline -m pytest

      - name: Generate coverage report
        run: uv run --python ${{ matrix.python-version }} --with coverage coverage xml -o coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
