[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplepipeline"
version = "0.1.0"
description = "Generic SQLite-backed scientific data reduction pipeline"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
simplepipeline = "simplepipeline.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
